# 导航菜单：
menu:
  首页:
    link: /
    icon: home
  关于:
    link: /about/
    icon: user
  # 友链:
  #   link: /links/
  #   icon: link
  # # 二级菜单示例
  文章:
    icon: folder
    item:
      分类:
        link: /categories/
        icon: folder
      标签:
        link: /tags/
        icon: tag
      归档:
        link: /archives/
        icon: archive

nav:
  enable: true
  menu:
    - title: 我的导航
      item:
        - name: GitHub
          link: https://github.com/zhootoo
          icon: github
        - name: 小红书
          link: https://xhslink.cn/m/4bcFlkfMqct
          icon: https://zhootoo.github.io/images/xiaohongshu.svg
    - title: 站内
      item:
        - name: 首页
          link: /
          icon: home
        - name: 关于
          link: /about/
          icon: user

# Favicon：默认使用主题内置 /images/favicon.png。
# 设为 false 时不输出 <link rel="icon">，交给浏览器请求站点根目录 /favicon.ico。
# favicon: /images/favicon.png
# favicon: false

# 背景特效
# 选项: default(默认纸纹) / grid(网格) / line(横线) / cross(十字星) / dotted(点阵)
background:
  style: default

profile:
  role: Software Engineer
  bio: 这是我的个人博客，用于记录技术学习、生活点滴与各种有趣的内容。
  # 头像图片路径（站点根的 source/ 目录下）。留空则使用 CSS 绘制的默认头像。
  avatar: /images/avatar.jpg
  # 头像图片形状：square（默认，原始方形）或 circle（应用圆形遮罩）
  avatar_shape: square
  # Profile 卡片站点统计；为空或 false 隐藏，true 显示无链接，其他非空值渲染为链接
  site_info:
    # posts: /archives/
    # categories: /categories/
    # tags: /tags/
  social:
    # 内置图标（按键名自动匹配，大小写不敏感）。未加前缀时优先匹配 Lucide；
    # Font Awesome Free 6 可写 fa-solid:trash-can / fa-regular:heart / fa-brands:github。
    #   github, twitter, x, mail/email, rss,
    #   steam, bilibili, youtube, facebook, instagram, telegram, weibo
    # 写法 1：键 -> URL（按键名自动匹配图标）
    # 默认不提供任何条目，避免主题默认值在站点配置中被"注释掉"后仍然显现。
    # 在站点的 _config.flatpaper.yml 里按需启用：
    GitHub: https://github.com/zhootoo
    Email: mailto:zhootoodhu@163.com
    # 小红书（自定义 SVG 图标）
    Xiaohongshu:
      url: https://xhslink.cn/m/4bcFlkfMqct
