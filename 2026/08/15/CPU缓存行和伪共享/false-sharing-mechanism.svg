<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <title>伪共享：缓存行失效循环（示意）</title>
  <rect width="920" height="600" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="460" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">伪共享：缓存行失效循环（示意）</text>

  <!-- 缓存行说明 -->
  <text x="460" y="80" text-anchor="middle" font-size="14" fill="#374151">内存中的同一条 64 字节缓存行（Cache Line），CPU 读写的最小单位</text>

  <!-- 缓存行条 -->
  <rect x="160" y="100" width="100" height="56" fill="#e5534b" stroke="#b91c1c" stroke-width="2"/>
  <rect x="260" y="100" width="100" height="56" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="360" y="100" width="400" height="56" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>

  <!-- 缓存行标签 -->
  <text x="210" y="133" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">x</text>
  <text x="310" y="133" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">y</text>
  <text x="560" y="133" text-anchor="middle" font-size="12" fill="#6b7280">…其余 56 字节…</text>

  <!-- x/y 偏移标注 -->
  <text x="210" y="180" text-anchor="middle" font-size="13" fill="#b91c1c">x：偏移 0–3，Core0 写</text>
  <text x="310" y="180" text-anchor="middle" font-size="13" fill="#1d4ed8">y：偏移 4–7，Core1 写</text>

  <!-- 关键提示 -->
  <text x="460" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">失效单位是整条缓存行，不是单个变量！</text>

  <!-- Core0 -->
  <rect x="60" y="340" width="190" height="84" rx="10" fill="#fef2f2" stroke="#e5534b" stroke-width="2"/>
  <text x="155" y="376" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">Core 0</text>
  <text x="155" y="400" text-anchor="middle" font-size="13" fill="#374151">只写 x，从不碰 y</text>

  <!-- Core1 -->
  <rect x="670" y="340" width="190" height="84" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="765" y="376" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">Core 1</text>
  <text x="765" y="400" text-anchor="middle" font-size="13" fill="#374151">只写 y，从不碰 x</text>

  <!-- ① Core0 写 x：箭头从 Core0 顶到缓存行 -->
  <path d="M 155 340 L 155 260 L 215 260 L 215 158" fill="none" stroke="#e5534b" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <circle cx="155" cy="290" r="15" fill="#e5534b"/>
  <text x="155" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">①</text>

  <!-- ② 广播失效：从缓存行到 Core1 -->
  <path d="M 265 156 L 265 240 C 265 300 765 300 765 336" fill="none" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="8,6" marker-end="url(#arrowGray)"/>
  <circle cx="560" cy="268" r="15" fill="#6b7280"/>
  <text x="560" y="273" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">②</text>

  <!-- ③ Core1 写 y：箭头从 Core1 顶到缓存行 -->
  <path d="M 765 340 L 765 250 L 665 250 L 315 158" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <circle cx="765" cy="290" r="15" fill="#3b82f6"/>
  <text x="765" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">③</text>

  <!-- ④ 广播失效：从缓存行到 Core0 -->
  <path d="M 155 156 L 155 250 C 155 310 155 310 155 336" fill="none" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="8,6" marker-end="url(#arrowGray)"/>
  <circle cx="155" cy="230" r="15" fill="#6b7280"/>
  <text x="155" y="235" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">④</text>

  <!-- 箭头说明 -->
  <text x="460" y="300" text-anchor="middle" font-size="13" fill="#374151">②④：MESI 一致性协议要求，写缓存行前必须让其他核的副本失效</text>

  <!-- 底部循环提示 -->
  <rect x="180" y="470" width="560" height="90" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="500" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">结果：①②③④ 无限循环，形成“失效风暴”</text>
  <text x="460" y="528" text-anchor="middle" font-size="13" fill="#92400e">Core0 写 x → 让 Core1 整行失效；Core1 写 y → 让 Core0 整行失效</text>
  <text x="460" y="548" text-anchor="middle" font-size="13" fill="#92400e">x、y 逻辑上毫无关系，硬件上却反复回写内存、反复重拉 —— 这就是伪共享</text>

  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#e5534b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
